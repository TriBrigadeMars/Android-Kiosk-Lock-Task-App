name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Android Platform Tools (Windows)
        run: |
          curl -L -o platform-tools.zip "https://dl.google.com/android/repository/platform-tools-latest-windows.zip"
          Expand-Archive -Path platform-tools.zip -DestinationPath . -Force
          Remove-Item platform-tools.zip

      - name: Verify pre-built APK
        run: |
          if (Test-Path "build/CU-Denver-Equity-Kiosk.apk") {
            Write-Host "Using pre-built APK"
          } else {
            Write-Error "No pre-built APK found. Build it first (bash build-apk.sh) and commit build/CU-Denver-Equity-Kiosk.apk"
            exit 1
          }

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Windows .exe
        run: |
          pyinstaller --onefile --windowed --name "CU-Denver-Equity-Kiosk-Manager" `
            --add-data "platform-tools;platform-tools" `
            --add-data "build/CU-Denver-Equity-Kiosk.apk;." `
            --add-data "TestDPC.apk;." `
            kiosk-manager.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-EXE
          path: dist/CU-Denver-Equity-Kiosk-Manager.exe
          retention-days: 30

      - name: Create GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CU-Denver-Equity-Kiosk-Manager.exe
          generate_release_notes: true
