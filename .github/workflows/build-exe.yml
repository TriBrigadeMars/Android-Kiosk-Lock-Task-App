name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  build-exe:
    runs-on: windows-latest
    permissions:
      contents: write  # needed to create/update the GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download Android Platform Tools (Windows)
        run: |
          curl -L -o platform-tools.zip "https://dl.google.com/android/repository/platform-tools-latest-windows.zip"
          Expand-Archive -Path platform-tools.zip -DestinationPath . -Force
          Remove-Item platform-tools.zip

      - name: Build APK from source
        # The release must always bundle an APK built from the CURRENT source,
        # not a stale committed build/CU-Denver-Equity-Kiosk.apk.
        # Set up JDK + Android SDK (mirrors setup-tools.bat), then run build-apk.sh.
        shell: bash
        run: |
          set -e
          # JDK 17
          if [ ! -d "jdk/jdk-17.0.20+8" ]; then
            mkdir -p jdk && cd jdk
            curl -L -o jdk.zip "https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jdk/hotspot/normal/eclipse"
            unzip -qo jdk.zip
            cd ..
          fi
          # Android SDK command-line tools
          if [ ! -d "android-sdk/cmdline-tools/latest" ]; then
            curl -L -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-win-13114758_latest.zip"
            mkdir -p android-sdk/cmdline-tools
            unzip -qo cmdline-tools.zip -d android-sdk/cmdline-tools
            mv android-sdk/cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest
            rm cmdline-tools.zip
          fi
          export JAVA_HOME=$(ls -d jdk/jdk-*/)
          export ANDROID_SDK_ROOT="$PWD/android-sdk"
          # Accept licenses + install platform/build-tools (best-effort)
          echo y | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager.bat" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager.bat" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
          bash build-apk.sh

      - name: Verify built APK
        run: |
          if (Test-Path "build/CU-Denver-Equity-Kiosk.apk") {
            Write-Host "APK built from source"
          } else {
            Write-Error "APK build failed"
            exit 1
          }

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Windows .exe
        run: |
          pyinstaller --onefile --windowed --name "CU-Denver-Equity-Kiosk-Manager" `
            --add-data "platform-tools;platform-tools" `
            --add-data "build/CU-Denver-Equity-Kiosk.apk;." `
            kiosk-manager.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: Windows-EXE
          path: dist/CU-Denver-Equity-Kiosk-Manager.exe
          retention-days: 30

      # Rolling "latest" release — always keeps the newest .exe downloadable
      # from the repo's Releases page, no tag or PR required.
      - name: Publish rolling latest release (push to main/master)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          body: |
            Latest Windows build of the CU Denver Equity Kiosk Manager.
            Built automatically from the latest commit on main/master.
            Download `CU-Denver-Equity-Kiosk-Manager.exe` below, double-click it,
            connect the tablet via USB, and click **Setup Kiosk**.
          files: dist/CU-Denver-Equity-Kiosk-Manager.exe
          fail_on_unmatched_files: true

      # Versioned release — attach the .exe when a version tag is pushed.
      - name: Create versioned GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/CU-Denver-Equity-Kiosk-Manager.exe
          generate_release_notes: true
